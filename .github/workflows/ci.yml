name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (neovim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.0, stable]
    env:
      PLENARY_PATH: ${{ github.workspace }}/.deps/plenary
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Install plenary (test-only dev dependency)
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim "$PLENARY_PATH"
      - name: Unit tests
        run: make test
      - name: Headless plugin load check (:Review defined, :help review, stderr empty)
        run: make plugin-check

  lint:
    name: luacheck (warnings 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1

  format:
    name: stylua --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
